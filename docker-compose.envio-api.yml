services:
  scalex-envio-api:
    build:
      context: ./envio-api
      dockerfile: Dockerfile
    environment:
      - NODE_ENV=production
      - ENVIO_API_PORT=3000
      - ENVIO_API_DATABASE_URL=${ENVIO_API_DATABASE_URL}
      - ENVIO_API_CORS_ORIGIN=${ENVIO_API_CORS_ORIGIN:-*}
    networks:
      - scalex-network
      - infrastructure
    restart: unless-stopped
    labels:
      # Traefik configuration
      - traefik.enable=true
      - traefik.http.services.scalex-envio-api.loadbalancer.server.port=3000
      # Dynamic host based on CHAIN_NAME environment variable
      - traefik.http.routers.${CHAIN_NAME:-base-sepolia}-envio-api.rule=Host(`${ENVIO_HOST_NAME:-base-sepolia-envio-api.scalex.money}`)
      - traefik.http.routers.${CHAIN_NAME:-base-sepolia}-envio-api.entrypoints=websecure
      - traefik.http.routers.${CHAIN_NAME:-base-sepolia}-envio-api.tls.certresolver=letsencrypt
      - traefik.http.routers.${CHAIN_NAME:-base-sepolia}-envio-api.service=scalex-envio-api

networks:
  scalex-network:
    external: true
    name: indexer_scalex-network
  infrastructure:
    external: true
    name: infrastructure
