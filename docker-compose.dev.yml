# Docker Compose for Local Development
# Includes host port mappings for local access

services:
  # ENVIO API service
  envio-api:
    build:
      context: ./envio-api
      dockerfile: Dockerfile
    ports:
      - "3000:3000"  # Host port 3000 for local development
    env_file:
      - .env
    environment:
      - NODE_ENV=development
      - PORT=3000
    depends_on:
      - scalex-postgres
      - envio-postgres
      - redis
    networks:
      - scalex-network
    restart: unless-stopped
    volumes:
      - ./envio-api:/app  # Mount for hot reloading in dev

  # SCALEX API database
  scalex-postgres:
    image: postgres:15-alpine
    environment:
      - POSTGRES_DB=scalex_api
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
    ports:
      - "5435:5432"  # Host port for local access
    volumes:
      - scalex_postgres_data:/var/lib/postgresql/data
    networks:
      - scalex-network
    restart: unless-stopped

  # Envio indexer service (primary indexer)
  envio-indexer:
    build:
      context: ./envio-indexer
      dockerfile: Dockerfile
    ports:
      - "8081:8080"  # GraphQL endpoint for local access (changed from 8080 to avoid OrbStack conflict)
    env_file:
      - .env
    environment:
      - NODE_ENV=development
      - HASURA_GRAPHQL_ENABLE_CONSOLE=true  # Enable console for development
    depends_on:
      - envio-postgres
      - redis
    networks:
      - scalex-network
    restart: unless-stopped
    volumes:
      - ./envio-indexer:/app  # Mount for hot reloading in dev

  # WebSocket service
  websocket-service:
    build:
      context: ./websocket-service
      dockerfile: Dockerfile
    ports:
      - "42080:42080"  # Host ports for local development
      - "42084:8080"  # Health port
    env_file:
      - .env
    environment:
      - NODE_ENV=development
    depends_on:
      - envio-postgres
      - redis
    networks:
      - scalex-network
    restart: unless-stopped
    volumes:
      - ./websocket-service:/app  # Mount for hot reloading in dev

  # Analytics service
  analytics-service:
    build:
      context: ./analytics-service
      dockerfile: Dockerfile
    ports:
      - "42090:42090"  # Host port for local development
    env_file:
      - .env
    environment:
      - NODE_ENV=development
    depends_on:
      - envio-postgres
      - timescaledb
      - redis
    networks:
      - scalex-network
    restart: unless-stopped
    volumes:
      - ./analytics-service:/app  # Mount for hot reloading in dev

  # PostgreSQL database for Envio indexer
  envio-postgres:
    image: postgres:17.5
    environment:
      - POSTGRES_DB=${ENVIO_PG_DATABASE:-envio-dev}
      - POSTGRES_USER=${ENVIO_PG_USER:-postgres}
      - POSTGRES_PASSWORD=${ENVIO_PG_PASSWORD:-testing}
    ports:
      - "5434:5432"  # Host port for local access
    volumes:
      - envio_postgres_data:/var/lib/postgresql/data
    networks:
      - scalex-network
    restart: unless-stopped

  # TimescaleDB for Analytics
  timescaledb:
    image: timescale/timescaledb:latest-pg15
    environment:
      - POSTGRES_DB=analytics
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
    ports:
      - "5436:5432"  # Host port for local access (changed from 5434 to avoid Ponder conflict)
    volumes:
      - timescale_data:/var/lib/postgresql/data
      - ./analytics-service/init:/docker-entrypoint-initdb.d
    command: ["postgres", "-c", "shared_preload_libraries=timescaledb"]
    networks:
      - scalex-network
    restart: unless-stopped

  # Redis for caching and message queuing
  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"  # Host port for local access
    volumes:
      - redis_data:/data
    networks:
      - scalex-network
    restart: unless-stopped
    command: redis-server --appendonly yes


  # Development tools
  redis-commander:
    image: rediscommander/redis-commander:latest
    ports:
      - "8081:8081"
    environment:
      - REDIS_HOSTS=local:redis:6379
    depends_on:
      - redis
    networks:
      - scalex-network
    restart: unless-stopped

volumes:
  scalex_postgres_data:
  envio_postgres_data:
  timescale_data:
  redis_data:

networks:
  scalex-network:
    driver: bridge