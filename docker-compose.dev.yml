# Development Docker Compose Configuration
# For local development with host port mappings
# Run with: docker-compose -f docker-compose.dev.yml up

services:
  # SCALEX API BASED ON ENVIO INDEXER
  scalex-envio-api: 
    build: 
      context: ./envio-api
      dockerfile: Dockerfile
    ports:
      - "3333:3000"  # Exposed to host for local development
    networks:
      - scalex-network
    restart: unless-stopped

  # SCALEX API service
  scalex-api:
    build:
      context: ./api
      dockerfile: Dockerfile
    env_file:
      - ./ponder/.env.core-chain
    environment:
      - DATABASE_URL=postgresql://postgres:password@scalex-postgres:5432/scalex_api
      - PONDER_DATABASE_URL=postgresql://postgres:password@postgres:5432/ponder_core
      - NODE_ENV=development
      - PORT=3000
    ports:
      - "3000:3000"  # Exposed to host for local development
    depends_on:
      - scalex-postgres
      - postgres
      - redis
    networks:
      - scalex-network
    restart: unless-stopped
    volumes:
      - ./api/logs:/app/logs

  # SCALEX API database
  scalex-postgres:
    image: postgres:15-alpine
    environment:
      - POSTGRES_DB=scalex_api
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
    ports:
      - "5435:5432"  # Exposed to host for local development
    volumes:
      - scalex_postgres_data:/var/lib/postgresql/data
    networks:
      scalex-network:
        aliases:
          - scalex-postgres
    restart: unless-stopped

  # Core indexer service
  # clob-indexer:
  #   build:
  #     context: .
  #     dockerfile: Dockerfile
  #   env_file:
  #     - ./ponder/.env.core-chain
  #   environment:
  #     # Override .env.core-chain with container networking
  #     - PONDER_DATABASE_URL=postgresql://postgres:password@postgres:5432/ponder_core
  #     - REDIS_URL=redis://redis:6379
  #     - PONDER_PORT=42070
  #   ports:
  #     - "42070:42070"  # Exposed to host for local development
  #   depends_on:
  #     - postgres
  #     - redis
  #   networks:
  #     - scalex-network
  #   restart: unless-stopped
  #   volumes:
  #     - ./logs:/app/logs

  # WebSocket service
  websocket-service:
    build:
      context: ./websocket-service
      dockerfile: Dockerfile
    env_file:
      - ./ponder/.env.core-chain
    environment:
      - PORT=42080
      - HEALTH_PORT=8080
      - REDIS_URL=redis://redis:6379
      - DATABASE_URL=postgresql://postgres:password@postgres:5432/ponder_core
      - CONSUMER_GROUP=websocket-consumers
      - CONSUMER_ID=ws-consumer-1
      - BATCH_SIZE=10
      - POLL_INTERVAL=1000
      - WS_PING_INTERVAL=30000
      - MAX_CONNECTIONS=1000
    ports:
      - "42080:42080"  # WebSocket service exposed to host
      - "8080:8080"    # Health check port exposed to host
    depends_on:
      - postgres
      - redis
    networks:
      - scalex-network
    restart: unless-stopped

  # Analytics service
  analytics-service:
    build:
      context: ./analytics-service
      dockerfile: Dockerfile
    env_file:
      - ./ponder/.env.core-chain
    environment:
      - PORT=42090
      - REDIS_URL=redis://redis:6379
      - DATABASE_URL=postgresql://postgres:password@postgres:5432/ponder_core
      - TIMESCALE_DATABASE_URL=postgresql://postgres:password@timescaledb:5432/analytics
      - CONSUMER_GROUP=analytics-consumers
      - CONSUMER_ID=analytics-consumer-1
      - ANALYTICS_BATCH_SIZE=5
      - ANALYTICS_POLL_INTERVAL=5000
      - CACHE_TTL=300
      - ENABLE_DAILY_SNAPSHOTS=true
      - ENABLE_HOURLY_AGGREGATION=true
      - ENABLE_CACHE_REFRESH=true
    ports:
      - "42090:42090"  # Analytics service exposed to host
    depends_on:
      - postgres
      - timescaledb
      - redis
    networks:
      - scalex-network
    restart: unless-stopped

  # PostgreSQL database (Main indexer DB)
  postgres:
    image: postgres:15-alpine
    environment:
      - POSTGRES_DB=ponder_core
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
    ports:
      - "5432:5432"  # Exposed to host for local development
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      scalex-network:
        aliases:
          - postgres
          - db
    restart: unless-stopped

  # TimescaleDB for Analytics
  timescaledb:
    image: timescale/timescaledb:latest-pg15
    environment:
      - POSTGRES_DB=analytics
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
    ports:
      - "5434:5432"  # Exposed to host on different port to avoid conflict
    volumes:
      - timescale_data:/var/lib/postgresql/data
      - ./analytics-service/init:/docker-entrypoint-initdb.d
    command: ["postgres", "-c", "shared_preload_libraries=timescaledb"]
    networks:
      scalex-network:
        aliases:
          - timescaledb
    restart: unless-stopped

  # Redis for caching and message queuing
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"  # Exposed to host for local development
    volumes:
      - redis_data:/data
    networks:
      scalex-network:
        aliases:
          - redis
    restart: unless-stopped
    command: redis-server --appendonly yes

  # Monitoring services
  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"  # Exposed to host for local development
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
    networks:
      - scalex-network
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3001:3000"  # Exposed to host (port 3001 to avoid conflict with scalex-api)
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana-dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana-datasources:/etc/grafana/provisioning/datasources:ro
    depends_on:
      - prometheus
    networks:
      - scalex-network
    restart: unless-stopped

  # Redis Commander for Redis management
  redis-commander:
    image: rediscommander/redis-commander:latest
    ports:
      - "8081:8081"  # Exposed to host for local development
    environment:
      - REDIS_HOSTS=local:redis:6379
    depends_on:
      - redis
    networks:
      - scalex-network
    restart: unless-stopped

volumes:
  postgres_data:
  scalex_postgres_data:
  timescale_data:
  redis_data:
  prometheus_data:
  grafana_data:

networks:
  scalex-network:
    driver: bridge