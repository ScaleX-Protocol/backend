# SCALEX API Docker Compose Configuration
# For standalone deployment of the API services

services:
  # SCALEX API service
  scalex-api:
    build:
      context: ./api
      dockerfile: Dockerfile
    env_file:
      - ${API_ENV_FILE:-./ponder/.env.core-chain}
    environment:
      - NODE_ENV=production
      - PORT=3000
      # Dynamic host configuration
      - CHAIN_NAME=${CHAIN_NAME:-base-sepolia}
      - HOST_NAME=${HOST_NAME:-base-sepolia-api.scalex.money}
    depends_on:
      - scalex-postgres
    networks:
      - scalex-network
    restart: unless-stopped
    volumes:
      - ./api/logs:/app/logs
    labels:
      # Traefik configuration
      - traefik.enable=true
      - traefik.http.services.scalex-api.loadbalancer.server.port=3000
      # Dynamic host based on CHAIN_NAME environment variable
      - traefik.http.routers.${CHAIN_NAME:-base-sepolia}-api.rule=Host(`${HOST_NAME:-base-sepolia-api.scalex.money}`)
      - traefik.http.routers.${CHAIN_NAME:-base-sepolia}-api.entrypoints=websecure
      - traefik.http.routers.${CHAIN_NAME:-base-sepolia}-api.tls.certresolver=letsencrypt
      - traefik.http.routers.${CHAIN_NAME:-base-sepolia}-api.service=scalex-api

  # SCALEX API database
  scalex-postgres:
    image: postgres:15-alpine
    environment:
      - POSTGRES_DB=scalex_api
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
    volumes:
      - scalex_postgres_data:/var/lib/postgresql/data
    networks:
      scalex-network:
        aliases:
          - scalex-postgres
    restart: unless-stopped

  # External PostgreSQL connection for indexer data
  # Note: API connects to the existing indexer database running in clob-indexer stack
  # PONDER_DATABASE_URL is configured to connect to postgres:5432/ponder_core

volumes:
  scalex_postgres_data:

networks:
  scalex-network:
    external: true
    name: indexer_scalex-network