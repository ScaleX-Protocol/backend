name: 🚀 Mantle Sepolia - Indexer Deployment

on:
  push:
    branches: [ mantle-sepolia-indexer ]
    paths:
      - 'ponder/**'
      - 'docker-compose.mantle-indexer.yml'
      - '.github/workflows/mantle-sepolia-indexer.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: [self-hosted, scalex]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
      
    - name: Set up Docker Compose
      run: |
        if ! command -v docker-compose &> /dev/null; then
          echo "Installing Docker Compose..."
          sudo curl -L "https://github.com/docker/compose/releases/download/v2.24.5/docker-compose-$(uname -s)-$(uname -m)" -o /usr/local/bin/docker-compose
          sudo chmod +x /usr/local/bin/docker-compose
        else
          echo "Docker Compose already installed:"
          docker-compose --version
        fi
        
    - name: Create Mantle environment configuration
      run: |
        # Create Mantle Sepolia environment configuration
        mkdir -p ./env/mantle-sepolia
        
        # Copy base configuration and override for Mantle Sepolia
        if [ -f "./ponder/.env.core-chain" ]; then
          cp ./ponder/.env.core-chain ./ponder/.env.mantle-sepolia
          echo "Created Mantle Sepolia environment from core-chain"
        fi
        
    - name: Verify indexer network exists for Mantle
      run: |
        # Create Mantle-specific network
        if ! docker network ls | grep -q "mantle_scalex-network"; then
          echo "Creating mantle_scalex-network..."
          docker network create mantle_scalex-network
        else
          echo "✅ mantle_scalex-network already exists"
        fi
        
    - name: Deploy Mantle Sepolia Indexer
      run: |
        echo "Deploying Mantle Sepolia indexer services..."
        
        # Set project name to avoid conflicts with Base Sepolia
        export COMPOSE_PROJECT_NAME=mantle-sepolia-indexer
        
        echo "=== Stopping any existing Base Sepolia services to prevent conflicts ==="
        docker-compose -f docker-compose.indexer.yml -p base-sepolia-indexer down --remove-orphans || true
        
        echo "=== Building Mantle Sepolia services ==="
        INDEXER_ENV_FILE=./ponder/.env.mantle-sepolia docker-compose -f docker-compose.mantle-indexer.yml -p mantle-sepolia-indexer build --no-cache || {
          echo "❌ Build failed, checking build logs..."
          INDEXER_ENV_FILE=./ponder/.env.mantle-sepolia docker-compose -f docker-compose.mantle-indexer.yml -p mantle-sepolia-indexer build --no-cache --progress=plain
          exit 1
        }
        
        echo "=== Stopping existing Mantle Sepolia services ==="
        INDEXER_ENV_FILE=./ponder/.env.mantle-sepolia docker-compose -f docker-compose.mantle-indexer.yml -p mantle-sepolia-indexer down --remove-orphans || true
        
        echo "=== Starting Mantle Sepolia services ==="
        INDEXER_ENV_FILE=./ponder/.env.mantle-sepolia docker-compose -f docker-compose.mantle-indexer.yml -p mantle-sepolia-indexer up -d || {
          echo "❌ Service start failed, checking logs..."
          INDEXER_ENV_FILE=./ponder/.env.mantle-sepolia docker-compose -f docker-compose.mantle-indexer.yml -p mantle-sepolia-indexer logs
          exit 1
        }
        
        # Wait for services to be healthy
        sleep 45
        
        # Check service status
        INDEXER_ENV_FILE=./ponder/.env.mantle-sepolia docker-compose -f docker-compose.mantle-indexer.yml -p mantle-sepolia-indexer ps
        
        echo "Mantle Sepolia indexer deployment completed"
        
    - name: Verify Mantle Sepolia Indexer deployment
      run: |
        echo "=============================================="
        echo "🔍 DEPLOYMENT VERIFICATION - MANTLE SEPOLIA"
        echo "=============================================="
        
        echo ""
        export COMPOSE_PROJECT_NAME=mantle-sepolia-indexer
        
        echo "=== 1. CONTAINER STATUS CHECK ==="
        echo "Checking if Mantle containers are running..."
        INDEXER_ENV_FILE=./ponder/.env.mantle-sepolia docker-compose -f docker-compose.mantle-indexer.yml -p mantle-sepolia-indexer ps
        
        echo ""
        echo "=== 2. DETAILED CONTAINER INSPECTION ==="
        
        # Check each container individually
        echo "--- PostgreSQL Container (Mantle) ---"
        POSTGRES_STATUS=$(INDEXER_ENV_FILE=./ponder/.env.mantle-sepolia docker-compose -f docker-compose.mantle-indexer.yml -p mantle-sepolia-indexer ps -q postgres)
        if [ -n "$POSTGRES_STATUS" ]; then
          echo "✅ PostgreSQL container is running: $POSTGRES_STATUS"
          echo "PostgreSQL health check:"
          INDEXER_ENV_FILE=./ponder/.env.mantle-sepolia docker-compose -f docker-compose.mantle-indexer.yml -p mantle-sepolia-indexer exec -T postgres pg_isready -U postgres -d ponder_core || echo "❌ PostgreSQL not ready"
        else
          echo "❌ PostgreSQL container is NOT running"
        fi
        
        echo ""
        echo "--- Redis Container (Mantle) ---"
        REDIS_STATUS=$(INDEXER_ENV_FILE=./ponder/.env.mantle-sepolia docker-compose -f docker-compose.mantle-indexer.yml -p mantle-sepolia-indexer ps -q redis)
        if [ -n "$REDIS_STATUS" ]; then
          echo "✅ Redis container is running: $REDIS_STATUS"
          echo "Redis health check:"
          INDEXER_ENV_FILE=./ponder/.env.mantle-sepolia docker-compose -f docker-compose.mantle-indexer.yml -p mantle-sepolia-indexer exec -T redis redis-cli ping || echo "❌ Redis not responding"
        else
          echo "❌ Redis container is NOT running"
        fi
        
        echo ""
        echo "--- Indexer Container (Mantle) ---"
        INDEXER_STATUS=$(INDEXER_ENV_FILE=./ponder/.env.mantle-sepolia docker-compose -f docker-compose.mantle-indexer.yml -p mantle-sepolia-indexer ps -q mantle-sepolia-clob-indexer)
        if [ -n "$INDEXER_STATUS" ]; then
          echo "✅ Indexer container is running: $INDEXER_STATUS"
          echo "Indexer container info:"
          INDEXER_ENV_FILE=./ponder/.env.mantle-sepolia docker-compose -f docker-compose.mantle-indexer.yml -p mantle-sepolia-indexer exec -T mantle-sepolia-clob-indexer ps aux || echo "Could not get process info"
          echo "Environment variables check:"
          INDEXER_ENV_FILE=./ponder/.env.mantle-sepolia docker-compose -f docker-compose.mantle-indexer.yml -p mantle-sepolia-indexer exec -T mantle-sepolia-clob-indexer env | grep -E "(CHAIN_ID|PONDER_RPC_URL|NETWORK)" || echo "Could not check environment"
        else
          echo "❌ Indexer container is NOT running"
        fi
        
        echo ""
        echo "--- WebSocket Container (Mantle) ---"
        WEBSOCKET_STATUS=$(INDEXER_ENV_FILE=./ponder/.env.mantle-sepolia docker-compose -f docker-compose.mantle-indexer.yml -p mantle-sepolia-indexer ps -q websocket-service)
        if [ -n "$WEBSOCKET_STATUS" ]; then
          echo "✅ WebSocket container is running: $WEBSOCKET_STATUS"
          echo "WebSocket container info:"
          INDEXER_ENV_FILE=./ponder/.env.mantle-sepolia docker-compose -f docker-compose.mantle-indexer.yml -p mantle-sepolia-indexer exec -T websocket-service ps aux || echo "Could not get process info"
        else
          echo "❌ WebSocket container is NOT running"
        fi
        
        echo ""
        echo "--- Analytics Container (Mantle) ---"
        ANALYTICS_STATUS=$(INDEXER_ENV_FILE=./ponder/.env.mantle-sepolia docker-compose -f docker-compose.mantle-indexer.yml -p mantle-sepolia-indexer ps -q analytics-service)
        if [ -n "$ANALYTICS_STATUS" ]; then
          echo "✅ Analytics container is running: $ANALYTICS_STATUS"
          echo "Analytics container info:"
          INDEXER_ENV_FILE=./ponder/.env.mantle-sepolia docker-compose -f docker-compose.mantle-indexer.yml -p mantle-sepolia-indexer exec -T analytics-service ps aux || echo "Could not get process info"
        else
          echo "❌ Analytics container is NOT running"
        fi
        
        echo ""
        echo "=== 3. LOG ANALYSIS ==="
        
        echo "--- PostgreSQL Logs (Mantle - last 15 lines) ---"
        INDEXER_ENV_FILE=./ponder/.env.mantle-sepolia docker-compose -f docker-compose.mantle-indexer.yml -p mantle-sepolia-indexer logs --tail=15 postgres
        
        echo ""
        echo "--- Redis Logs (Mantle - last 10 lines) ---"
        INDEXER_ENV_FILE=./ponder/.env.mantle-sepolia docker-compose -f docker-compose.mantle-indexer.yml -p mantle-sepolia-indexer logs --tail=10 redis
        
        echo ""
        echo "--- Indexer Logs (Mantle - last 25 lines) ---"
        INDEXER_ENV_FILE=./ponder/.env.mantle-sepolia docker-compose -f docker-compose.mantle-indexer.yml -p mantle-sepolia-indexer logs --tail=25 mantle-sepolia-clob-indexer
        
        echo ""
        echo "--- WebSocket Logs (Mantle - last 15 lines) ---"
        INDEXER_ENV_FILE=./ponder/.env.mantle-sepolia docker-compose -f docker-compose.mantle-indexer.yml -p mantle-sepolia-indexer logs --tail=15 websocket-service
        
        echo ""
        echo "--- Analytics Logs (Mantle - last 15 lines) ---"
        INDEXER_ENV_FILE=./ponder/.env.mantle-sepolia docker-compose -f docker-compose.mantle-indexer.yml -p mantle-sepolia-indexer logs --tail=15 analytics-service
        
        echo ""
        echo "=== 4. WAITING FOR SERVICES TO FULLY START (90 seconds) ==="
        echo "Giving Mantle services more time to initialize..."
        sleep 90
        
        echo ""
        echo "=== 5. SERVICE CONNECTIVITY TESTS ==="
        
        # Test database connections
        echo "--- Database Connection Tests (Mantle) ---"
        if INDEXER_ENV_FILE=./ponder/.env.mantle-sepolia docker-compose -f docker-compose.mantle-indexer.yml -p mantle-sepolia-indexer exec -T postgres pg_isready -U postgres -d ponder_core; then
          echo "✅ PostgreSQL database connection successful"
        else
          echo "❌ PostgreSQL database connection failed"
        fi
        
        # Test Redis connection
        if INDEXER_ENV_FILE=./ponder/.env.mantle-sepolia docker-compose -f docker-compose.mantle-indexer.yml -p mantle-sepolia-indexer exec -T redis redis-cli ping; then
          echo "✅ Redis connection successful"
        else
          echo "❌ Redis connection failed"
        fi
        
        echo ""
        echo "--- Application Health Checks (Mantle) ---"
        # Test indexer service
        for i in {1..12}; do
          echo "Attempt $i/12: Testing Mantle indexer health..."
          if INDEXER_ENV_FILE=./ponder/.env.mantle-sepolia docker-compose -f docker-compose.mantle-indexer.yml -p mantle-sepolia-indexer exec -T mantle-sepolia-clob-indexer curl -f http://localhost:42070/ 2>/dev/null; then
            echo "✅ Mantle indexer health check passed"
            break
          else
            echo "Mantle indexer not ready, waiting 10 seconds..."
            sleep 10
          fi
        done
        
        # Test websocket service (non-critical)
        WEBSOCKET_SUCCESS=false
        for i in {1..3}; do
          echo "Attempt $i/3: Testing Mantle websocket health..."
          if INDEXER_ENV_FILE=./ponder/.env.mantle-sepolia docker-compose -f docker-compose.mantle-indexer.yml -p mantle-sepolia-indexer exec -T websocket-service curl -f http://localhost:42080/ 2>/dev/null; then
            echo "✅ Mantle websocket health check passed"
            WEBSOCKET_SUCCESS=true
            break
          else
            echo "Mantle websocket not ready, waiting 5 seconds..."
            sleep 5
          fi
        done
        
        if [ "$WEBSOCKET_SUCCESS" = false ]; then
          echo "⚠️ Mantle WebSocket health check failed (non-critical service)"
        fi
        
        # Test analytics service (non-critical)
        # ANALYTICS_SUCCESS=false
        # for i in {1..6}; do
        #   echo "Attempt $i/6: Testing Mantle analytics health..."
        #   if INDEXER_ENV_FILE=./ponder/.env.mantle-sepolia docker-compose -f docker-compose.mantle-indexer.yml -p mantle-sepolia-indexer exec -T analytics-service curl -f http://localhost:42090/ 2>/dev/null; then
        #     echo "✅ Mantle analytics health check passed"
        #     ANALYTICS_SUCCESS=true
        #     break
        #   else
        #     echo "Mantle analytics not ready, waiting 5 seconds..."
        #     sleep 5
        #   fi
        # done
        
        if [ "$ANALYTICS_SUCCESS" = false ]; then
          echo "⚠️ Mantle Analytics health check failed (non-critical service)"
        fi
        
        echo ""
        echo "=== 6. FINAL STATUS SUMMARY ==="
        echo "All Mantle container statuses:"
        INDEXER_ENV_FILE=./ponder/.env.mantle-sepolia docker-compose -f docker-compose.mantle-indexer.yml -p mantle-sepolia-indexer ps
        
        echo ""
        echo "=============================================="
        echo "🎯 MANTLE SEPOLIA DEPLOYMENT VERIFICATION COMPLETE"
        echo "=============================================="