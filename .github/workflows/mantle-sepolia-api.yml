name: 🚀 Mantle Sepolia - API Deployment

on:
  push:
    branches: [ mantle-sepolia-api ]
  pull_request:
    branches: [ mantle-sepolia-api ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: [self-hosted, scalex]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
      
    - name: Set up Docker Compose
      run: |
        if ! command -v docker-compose &> /dev/null; then
          echo "Installing Docker Compose..."
          sudo curl -L "https://github.com/docker/compose/releases/download/v2.24.5/docker-compose-$(uname -s)-$(uname -m)" -o /usr/local/bin/docker-compose
          sudo chmod +x /usr/local/bin/docker-compose
        else
          echo "Docker Compose already installed:"
          docker-compose --version
        fi
        
    - name: Create Mantle environment configuration
      run: |
        # Create Mantle Sepolia environment configuration
        mkdir -p ./env/mantle-sepolia
        
        # Copy base configuration and override for Mantle Sepolia
        if [ -f "./api/.env.example" ]; then
          cp ./api/.env.example ./api/.env.mantle-sepolia
          echo "Created Mantle Sepolia API environment"
        fi
        
    - name: Verify indexer network exists for Mantle
      run: |
        # Check if the Mantle indexer network exists, create if it doesn't
        if ! docker network ls | grep -q "mantle_scalex-network"; then
          echo "Creating mantle_scalex-network..."
          docker network create mantle_scalex-network
        else
          echo "✅ mantle_scalex-network already exists"
        fi
        
    - name: Deploy Mantle Sepolia API
      run: |
        echo "Deploying Mantle Sepolia API services..."
        
        # Set project name to avoid conflicts with Base Sepolia API
        export COMPOSE_PROJECT_NAME=mantle-sepolia-api
        
        echo "=== Stopping any existing Base Sepolia API services to prevent conflicts ==="
        docker-compose -f docker-compose.api.yml -p base-sepolia-api down --remove-orphans || true
        
        echo "=== Building Mantle Sepolia API services ==="
        API_ENV_FILE=./api/.env.mantle-sepolia CHAIN_NAME=mantle-sepolia HOST_NAME=mantle-sepolia-api.scalex.money docker-compose -f docker-compose.api.yml -p mantle-sepolia-api build --no-cache || {
          echo "❌ Build failed, checking build logs..."
          API_ENV_FILE=./api/.env.mantle-sepolia CHAIN_NAME=mantle-sepolia HOST_NAME=mantle-sepolia-api.scalex.money docker-compose -f docker-compose.api.yml -p mantle-sepolia-api build --no-cache --progress=plain
          exit 1
        }
        
        # Stop existing Mantle API services
        API_ENV_FILE=./api/.env.mantle-sepolia CHAIN_NAME=mantle-sepolia HOST_NAME=mantle-sepolia-api.scalex.money docker-compose -f docker-compose.api.yml -p mantle-sepolia-api down --remove-orphans || true
        
        # Start API services
        API_ENV_FILE=./api/.env.mantle-sepolia CHAIN_NAME=mantle-sepolia HOST_NAME=mantle-sepolia-api.scalex.money docker-compose -f docker-compose.api.yml -p mantle-sepolia-api up -d || {
          echo "❌ API service start failed, checking logs..."
          API_ENV_FILE=./api/.env.mantle-sepolia CHAIN_NAME=mantle-sepolia HOST_NAME=mantle-sepolia-api.scalex.money docker-compose -f docker-compose.api.yml -p mantle-sepolia-api logs
          exit 1
        }
        
        # Wait for services to be healthy
        sleep 30
        
        # Check service status
        API_ENV_FILE=./api/.env.mantle-sepolia CHAIN_NAME=mantle-sepolia HOST_NAME=mantle-sepolia-api.scalex.money docker-compose -f docker-compose.api.yml -p mantle-sepolia-api ps
        
        echo "Mantle Sepolia API deployment completed"
        
    - name: Verify Mantle Sepolia API deployment
      run: |
        export COMPOSE_PROJECT_NAME=mantle-sepolia-api
        
        echo "==============================================="
        echo "🔍 DEPLOYMENT VERIFICATION - MANTLE SEPOLIA API"
        echo "==============================================="
        
        echo ""
        echo "=== 1. MANTLE API CONTAINER STATUS CHECK ==="
        API_ENV_FILE=./api/.env.mantle-sepolia CHAIN_NAME=mantle-sepolia HOST_NAME=mantle-sepolia-api.scalex.money docker-compose -f docker-compose.api.yml -p mantle-sepolia-api ps
        
        echo ""
        echo "=== 2. MANTLE API SERVICE HEALTH CHECKS ==="
        # Check if SCALEX Envio API is responding
        for i in {1..12}; do
          echo "Attempt $i/12: Testing Mantle SCALEX Envio API..."
          if API_ENV_FILE=./api/.env.mantle-sepolia CHAIN_NAME=mantle-sepolia HOST_NAME=mantle-sepolia-api.scalex.money docker-compose -f docker-compose.api.yml -p mantle-sepolia-api exec -T scalex-envio-api curl -f http://localhost:3000/ 2>/dev/null; then
            echo "✅ Mantle Sepolia SCALEX Envio API is responding"
            break
          else
            echo "Mantle SCALEX Envio API not ready, waiting 5 seconds..."
            sleep 5
          fi
        done
        
        # Check if SCALEX API is responding
        for i in {1..12}; do
          echo "Attempt $i/12: Testing Mantle SCALEX API..."
          if API_ENV_FILE=./api/.env.mantle-sepolia CHAIN_NAME=mantle-sepolia HOST_NAME=mantle-sepolia-api.scalex.money docker-compose -f docker-compose.api.yml -p mantle-sepolia-api exec -T scalex-api curl -f http://localhost:3000/ 2>/dev/null; then
            echo "✅ Mantle Sepolia SCALEX API is responding"
            break
          else
            echo "Mantle SCALEX API not ready, waiting 5 seconds..."
            sleep 5
          fi
        done
        
        echo ""
        echo "=== 3. MANTLE DATABASE VERIFICATION ==="
        # Verify database connections
        echo "Verifying database connections..."
        if API_ENV_FILE=./api/.env.mantle-sepolia CHAIN_NAME=mantle-sepolia HOST_NAME=mantle-sepolia-api.scalex.money docker-compose -f docker-compose.api.yml -p mantle-sepolia-api exec -T scalex-postgres pg_isready -U postgres -d scalex_api; then
          echo "✅ Mantle Sepolia API database connection verified"
        else
          echo "❌ Mantle Sepolia API database connection failed"
        fi
        
        echo ""
        echo "=== 4. MANTLE API LOG ANALYSIS ==="
        echo "--- Mantle SCALEX API Logs (last 20 lines) ---"
        API_ENV_FILE=./api/.env.mantle-sepolia CHAIN_NAME=mantle-sepolia HOST_NAME=mantle-sepolia-api.scalex.money docker-compose -f docker-compose.api.yml -p mantle-sepolia-api logs --tail=20 scalex-api
        
        echo ""
        echo "--- Mantle SCALEX Envio API Logs (last 15 lines) ---"
        API_ENV_FILE=./api/.env.mantle-sepolia CHAIN_NAME=mantle-sepolia HOST_NAME=mantle-sepolia-api.scalex.money docker-compose -f docker-compose.api.yml -p mantle-sepolia-api logs --tail=15 scalex-envio-api
        
        echo ""
        echo "--- Mantle PostgreSQL API Logs (last 10 lines) ---"
        API_ENV_FILE=./api/.env.mantle-sepolia CHAIN_NAME=mantle-sepolia HOST_NAME=mantle-sepolia-api.scalex.money docker-compose -f docker-compose.api.yml -p mantle-sepolia-api logs --tail=10 scalex-postgres
        
        echo ""
        echo "==============================================="
        echo "🎯 MANTLE SEPOLIA API VERIFICATION COMPLETE"
        echo "==============================================="