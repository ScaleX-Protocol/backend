name: 🚀 Base Sepolia - API Deployment

on:
  push:
    branches: [ base-sepolia-api ]
  pull_request:
    branches: [ base-sepolia-api ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
      
    - name: Set up Docker Compose
      run: |
        if ! command -v docker-compose &> /dev/null; then
          echo "Installing Docker Compose..."
          sudo curl -L "https://github.com/docker/compose/releases/download/v2.24.5/docker-compose-$(uname -s)-$(uname -m)" -o /usr/local/bin/docker-compose
          sudo chmod +x /usr/local/bin/docker-compose
        else
          echo "Docker Compose already installed:"
          docker-compose --version
        fi
        
    - name: Verify indexer network exists
      run: |
        # Check if the indexer network exists, create if it doesn't
        if ! docker network ls | grep -q "indexer_scalex-network"; then
          echo "Creating indexer_scalex-network..."
          docker network create indexer_scalex-network
        else
          echo "✅ indexer_scalex-network already exists"
        fi
        
    - name: Deploy API services
      run: |
        echo "Deploying Base Sepolia API services..."
        
        # Build services
        API_ENV_FILE=./api/.env.base-sepolia docker-compose -f docker-compose.api.yml build
        
        # Stop existing API services
        API_ENV_FILE=./api/.env.base-sepolia docker-compose -f docker-compose.api.yml down || true
        
        # Start API services
        API_ENV_FILE=./api/.env.base-sepolia docker-compose -f docker-compose.api.yml up -d
        
        # Wait for services to be healthy
        sleep 30
        
        # Check service status
        docker-compose -f docker-compose.api.yml ps
        
        echo "Base Sepolia API deployment completed"
        
    - name: Verify deployment
      run: |
        # Check if SCALEX Envio API is responding
        timeout 60 bash -c 'until curl -f http://localhost:3333/; do sleep 5; done'
        echo "✅ Base Sepolia SCALEX Envio API is responding on port 3333"
        
        # Check if SCALEX API is responding
        timeout 60 bash -c 'until curl -f http://localhost:3000/; do sleep 5; done'
        echo "✅ Base Sepolia SCALEX API is responding on port 3000"
        
        # Verify database connections
        echo "Verifying database connections..."
        docker-compose -f docker-compose.api.yml exec -T scalex-postgres pg_isready -U postgres -d scalex_api
        echo "✅ API database connection verified"