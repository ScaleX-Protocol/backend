# Production Docker Compose Configuration
# For deployment (Coolify, etc.) - No host port mappings
# Use docker-compose.dev.yml for local development with port access

services:
  # ENVIO API service
  envio-api:
    build:
      context: ./envio-api
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql://postgres:password@scalex-postgres:5432/scalex_api}
      - ENVIO_DATABASE_URL=${ENVIO_DATABASE_URL:-postgresql://postgres:testing@envio-postgres:5432/envio-dev}
      - FAUCET_DATABASE_URL=${FAUCET_DATABASE_URL:-postgresql://postgres:password@scalex-postgres:5432/envio_faucet}
      - NODE_ENV=production
      - PORT=3000
    depends_on:
      - scalex-postgres
      - envio-postgres
      - redis
    networks:
      - scalex-network
    restart: unless-stopped

  # SCALEX API database
  scalex-postgres:
    image: postgres:15-alpine
    environment:
      - POSTGRES_DB=scalex_api
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
    ports:
      - "5435:5432"
    volumes:
      - scalex_postgres_data:/var/lib/postgresql/data
    networks:
      - scalex-network
    restart: unless-stopped

  # Envio indexer service (primary indexer)
  envio-indexer:
    build:
      context: ./envio-indexer
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://${ENVIO_PG_USER:-postgres}:${ENVIO_PG_PASSWORD:-testing}@envio-postgres:5432/${ENVIO_PG_DATABASE:-envio-dev}
      - ENVIO_PG_PASSWORD=${ENVIO_PG_PASSWORD:-testing}
      - ENVIO_PG_USER=${ENVIO_PG_USER:-postgres}
      - ENVIO_PG_DATABASE=${ENVIO_PG_DATABASE:-envio-dev}
      - ENVIO_PG_HOST=envio-postgres
      - ENVIO_PG_PORT=5432
      - HASURA_GRAPHQL_DATABASE_URL=postgresql://${ENVIO_PG_USER:-postgres}:${ENVIO_PG_PASSWORD:-testing}@envio-postgres:5432/${ENVIO_PG_DATABASE:-envio-dev}
      - HASURA_GRAPHQL_ADMIN_SECRET=${HASURA_GRAPHQL_ADMIN_SECRET:-testing}
      - HASURA_GRAPHQL_ENABLE_CONSOLE=${HASURA_GRAPHQL_ENABLE_CONSOLE:-false}
    depends_on:
      - envio-postgres
      - redis
    networks:
      - scalex-network
    restart: "no"

  # WebSocket service
  websocket-service:
    build:
      context: ./websocket-service
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      - PORT=${WEBSOCKET_PORT:-42080}
      - HEALTH_PORT=8080
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      - DATABASE_URL=${WEBSOCKET_DATABASE_URL:-postgresql://postgres:testing@envio-postgres:5432/envio-dev}
      - CONSUMER_GROUP=websocket-consumers
      - CONSUMER_ID=ws-consumer-1
      - BATCH_SIZE=${WS_BATCH_SIZE:-10}
      - POLL_INTERVAL=${WS_POLL_INTERVAL:-1000}
      - WS_PING_INTERVAL=${WS_PING_INTERVAL:-30000}
      - MAX_CONNECTIONS=${WS_MAX_CONNECTIONS:-1000}
    depends_on:
      - envio-postgres
      - redis
    networks:
      - scalex-network
    restart: unless-stopped

  # Analytics service
  analytics-service:
    build:
      context: ./analytics-service
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      - PORT=${ANALYTICS_PORT:-42090}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      - DATABASE_URL=${ANALYTICS_DATABASE_URL:-postgresql://postgres:testing@envio-postgres:5432/envio-dev}
      - TIMESCALE_DATABASE_URL=${TIMESCALE_DATABASE_URL:-postgresql://postgres:password@timescaledb:5432/analytics}
      - CONSUMER_GROUP=analytics-consumers
      - CONSUMER_ID=analytics-consumer-1
      - ANALYTICS_BATCH_SIZE=${ANALYTICS_BATCH_SIZE:-5}
      - ANALYTICS_POLL_INTERVAL=${ANALYTICS_POLL_INTERVAL:-5000}
      - CACHE_TTL=${ANALYTICS_CACHE_TTL:-300}
      - ENABLE_DAILY_SNAPSHOTS=${ENABLE_DAILY_SNAPSHOTS:-true}
      - ENABLE_HOURLY_AGGREGATION=${ENABLE_HOURLY_AGGREGATION:-true}
      - ENABLE_CACHE_REFRESH=${ENABLE_CACHE_REFRESH:-true}
    depends_on:
      - envio-postgres
      - timescaledb
      - redis
    networks:
      - scalex-network
    restart: unless-stopped

  # PostgreSQL database for Envio indexer
  envio-postgres:
    image: postgres:17.5
    environment:
      - POSTGRES_DB=${ENVIO_PG_DATABASE:-envio-dev}
      - POSTGRES_USER=${ENVIO_PG_USER:-postgres}
      - POSTGRES_PASSWORD=${ENVIO_PG_PASSWORD:-testing}
    ports:
      - "5433:5432"
    volumes:
      - envio_postgres_data:/var/lib/postgresql/data
    networks:
      - scalex-network
    restart: unless-stopped

  # TimescaleDB for Analytics
  timescaledb:
    image: timescale/timescaledb:latest-pg15
    environment:
      - POSTGRES_DB=analytics
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
    volumes:
      - timescale_data:/var/lib/postgresql/data
      - ./analytics-service/init:/docker-entrypoint-initdb.d
    command: ["postgres", "-c", "shared_preload_libraries=timescaledb"]
    networks:
      - scalex-network
    restart: unless-stopped

  # Redis for caching and message queuing
  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    networks:
      - scalex-network
    restart: unless-stopped
    command: redis-server --appendonly yes



  # Monitoring services (COMMENTED OUT)
