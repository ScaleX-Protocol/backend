# Mantle Sepolia Indexer Docker Compose Configuration
# For standalone deployment of the indexer and related services on Mantle network

services:
  # Core indexer service
  clob-indexer:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - ${INDEXER_ENV_FILE:-./ponder/.env.core-chain}
    environment:
      # Override .env.core-chain with container networking
      - PONDER_DATABASE_URL=postgresql://postgres:password@postgres:5432/ponder_core
      - REDIS_URL=redis://redis:6379
      - PONDER_PORT=42070
    
    depends_on:
      - postgres
      - redis
    networks:
      - mantle-scalex-network
    restart: unless-stopped
    volumes:
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:42070/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    labels:
      # Traefik configuration
      - traefik.enable=true
      - traefik.http.services.mantle-indexer.loadbalancer.server.port=42070
      # Mantle Sepolia Router
      - traefik.http.routers.mantle-sepolia-indexer.rule=Host(`mantle-sepolia-indexer.scalex.money`)
      - traefik.http.routers.mantle-sepolia-indexer.entrypoints=websecure
      - traefik.http.routers.mantle-sepolia-indexer.tls.certresolver=letsencrypt
      - traefik.http.routers.mantle-sepolia-indexer.service=mantle-indexer

  # WebSocket service
  websocket-service:
    build:
      context: ./websocket-service
      dockerfile: Dockerfile
    env_file:
      - ${INDEXER_ENV_FILE:-./ponder/.env.core-chain}
    environment:
      - PORT=42080
      - HEALTH_PORT=8080
      - REDIS_URL=redis://redis:6379
      - DATABASE_URL=postgresql://postgres:password@postgres:5432/ponder_core
      - CONSUMER_GROUP=websocket-consumers
      - CONSUMER_ID=ws-consumer-1
      - BATCH_SIZE=10
      - POLL_INTERVAL=1000
      - WS_PING_INTERVAL=30000
      - MAX_CONNECTIONS=1000
    
    depends_on:
      - postgres
      - redis
    networks:
      - mantle-scalex-network
    restart: unless-stopped
    labels:
      # Traefik configuration
      - traefik.enable=true
      - traefik.http.services.mantle-websocket-service.loadbalancer.server.port=42080
      # Mantle Sepolia WebSocket Router
      - traefik.http.routers.mantle-sepolia-websocket.rule=Host(`mantle-sepolia-websocket.scalex.money`)
      - traefik.http.routers.mantle-sepolia-websocket.entrypoints=websecure
      - traefik.http.routers.mantle-sepolia-websocket.tls.certresolver=letsencrypt
      - traefik.http.routers.mantle-sepolia-websocket.service=mantle-websocket-service
      # WebSocket specific configuration for WebSocket protocol
      - traefik.http.routers.mantle-sepolia-websocket-websocket.rule=Host(`mantle-sepolia-websocket.scalex.money`)
      - traefik.http.routers.mantle-sepolia-websocket-websocket.entrypoints=websecure
      - traefik.http.routers.mantle-sepolia-websocket-websocket.tls.certresolver=letsencrypt
      - traefik.http.routers.mantle-sepolia-websocket-websocket.service=mantle-websocket-service
      - traefik.http.routers.mantle-sepolia-websocket-websocket.middlewares=mantle-websocket-headers
      - traefik.http.middlewares.mantle-websocket-headers.headers.customRequestHeaders.Connection=Upgrade
      - traefik.http.middlewares.mantle-websocket-headers.headers.customRequestHeaders.Upgrade=websocket

  # Analytics service
  analytics-service:
    build:
      context: ./analytics-service
      dockerfile: Dockerfile
    env_file:
      - ${INDEXER_ENV_FILE:-./ponder/.env.core-chain}
    environment:
      - PORT=42090
      - REDIS_URL=redis://redis:6379
      - DATABASE_URL=postgresql://postgres:password@postgres:5432/ponder_core
      - TIMESCALE_DATABASE_URL=postgresql://postgres:password@timescaledb:5432/analytics
      - CONSUMER_GROUP=analytics-consumers
      - CONSUMER_ID=analytics-consumer-1
      - ANALYTICS_BATCH_SIZE=5
      - ANALYTICS_POLL_INTERVAL=5000
      - CACHE_TTL=300
      - ENABLE_DAILY_SNAPSHOTS=true
      - ENABLE_HOURLY_AGGREGATION=true
      - ENABLE_CACHE_REFRESH=true
    
    depends_on:
      - postgres
      - timescaledb
      - redis
    networks:
      - mantle-scalex-network
    restart: unless-stopped
    labels:
      # Traefik configuration
      - traefik.enable=true
      - traefik.http.services.mantle-analytics-service.loadbalancer.server.port=42090

  # PostgreSQL database (Main indexer DB)
  postgres:
    image: postgres:15-alpine
    environment:
      - POSTGRES_DB=ponder_core
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
    volumes:
      - mantle_postgres_data:/var/lib/postgresql/data
    networks:
      mantle-scalex-network:
        aliases:
          - postgres
          - db
    restart: unless-stopped

  # TimescaleDB for Analytics
  timescaledb:
    image: timescale/timescaledb:latest-pg15
    environment:
      - POSTGRES_DB=analytics
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
    volumes:
      - mantle_timescale_data:/var/lib/postgresql/data
      - ./analytics-service/init:/docker-entrypoint-initdb.d
    command: ["postgres", "-c", "shared_preload_libraries=timescaledb"]
    networks:
      mantle-scalex-network:
        aliases:
          - timescaledb
    restart: unless-stopped

  # Redis for caching and message queuing
  redis:
    image: redis:7-alpine
    volumes:
      - mantle_redis_data:/data
    networks:
      mantle-scalex-network:
        aliases:
          - redis
    restart: unless-stopped
    command: redis-server --appendonly yes

volumes:
  mantle_postgres_data:
  mantle_timescale_data:
  mantle_redis_data:

networks:
  mantle-scalex-network:
    name: mantle_scalex-network
    driver: bridge